[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # package.json requires >=22.12.0; Netlify's default image may be older,
  # which fails the Astro 7 build. Pin it explicitly.
  NODE_VERSION = "22"

# Netlify Forms detects forms in the built HTML automatically (see
# src/pages/about.astro's data-netlify="true" form) — no extra config needed
# beyond deploying this repo on Netlify.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Default social share (OG) image, 1200x630. This SVG is the source of
       truth; og-default.png is rendered from it and is what pages actually
       reference, because LinkedIn, Facebook, WhatsApp, X and Slack do not
       render SVG Open Graph images.

       After editing, re-render the PNG with headless Chrome using the flags
       "headless", "window-size=1200,630" and "screenshot=og-default.png". -->

  <rect width="1200" height="630" fill="#12181F" />
  <svg x="100" y="215" width="200" height="200" viewBox="0 0 100 100">
    <path d="M 76.2 68.4 A 32 32 0 1 1 76.2 31.6" fill="none" stroke="#3FB0BA" stroke-width="11" stroke-linecap="round" />
    <rect x="66" y="44.5" width="30" height="11" rx="5.5" fill="#F0954F" />
  </svg>
  <text x="340" y="278" font-family="'Bricolage Grotesque', sans-serif" font-weight="700" font-size="30" fill="#9BB0AF" letter-spacing="0.06em">COREFLOW</text>
  <text x="338" y="346" font-family="'Bricolage Grotesque', sans-serif" font-weight="600" font-size="46" fill="#EAF0EF">Business ERP for growing SMEs</text>
  <text x="340" y="398" font-family="'IBM Plex Sans', sans-serif" font-weight="400" font-size="24" fill="#9BB0AF">CRM · Inventory · Sales · Procurement · Finance</text>
</svg>
